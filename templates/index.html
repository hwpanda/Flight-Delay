<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Predict Arrival Delay</title>

		<!-- Bootstrap CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
        <!-- Leaflet CSS -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>

		<style>
			body {
				background-color: #f5f7fb;
			}
			.page-title {
				font-weight: 700;
				margin-bottom: 1rem;
			}
			.card {
				border-radius: 0.75rem;
				box-shadow: 0 2px 4px rgba(15, 23, 42, 0.06);
			}
			#prediction-banner {
				display: none;
				font-weight: 600;
			}
			#map-container {
				height: 100%;
                min-height: 400px;
				border-radius: 0.75rem;
                z-index: 1;
			}
		</style>
	</head>

	<body>
		<div class="container-fluid p-4">
			<h1 class="page-title h3">Predict Arrival Delay</h1>

			<div class="row g-4">
				<!-- Left column: inputs + prediction -->
				<div class="col-md-5 col-lg-4">
					<div class="card p-3 mb-3">
						<form id="prediction-form">
							<div class="row mb-3">
								<div class="col">
									<label for="flight-date" class="form-label"
										>Flight Date</label
									>
									<input
										type="date"
										id="flight-date"
										class="form-control"
										required
									/>
								</div>
							</div>

                            <div class="row mb-3">
                                <div class="col">
                                    <label for="dep-time" class="form-label">Scheduled Departure</label>
                                    <input type="time" id="dep-time" class="form-control" required />
                                </div>
                                <div class="col">
                                    <label for="arr-time" class="form-label">Scheduled Arrival</label>
                                    <input type="time" id="arr-time" class="form-control" required />
                                </div>
                            </div>



							<div class="mb-3">
								<label for="airline" class="form-label">Airline</label>
                                <select id="airline" class="form-select" required>
                                    <option value="" selected disabled>Select Airline</option>
                                    {% for code, name in airlines.items() %}
                                    <option value="{{ code }}">{{ name }} ({{ code }})</option>
                                    {% endfor %}
                                </select>
							</div>

							<div class="mb-3">
								<label class="form-label">Route</label>
								<div class="row">
									<div class="col">
                                        <label for="origin-airport" class="form-label small text-muted">Origin</label>
										<input
											type="text"
											id="origin-airport"
											class="form-control"
											placeholder="ATL"
											maxlength="4"
											required
										/>
									</div>
									<div class="col">
                                        <label for="dest-airport" class="form-label small text-muted">Destination</label>
										<input
											type="text"
											id="dest-airport"
											class="form-control"
											placeholder="LAX"
											maxlength="4"
											required
										/>
									</div>
								</div>
							</div>

							<button class="btn btn-primary w-100" type="submit">
								Predict
							</button>
						</form>
					</div>

					<div
						id="prediction-banner"
						class="alert mt-2 text-center"
						role="alert"
					></div>

					<div class="card p-3 mt-3 small">
						<p class="mb-1 fw-semibold">Model notes</p>
						<p class="mb-0">
							The input data is transformed into the features used to train the
							delay model. Missing features (weather, etc.) are filled with averages.
						</p>
					</div>
				</div>

				<!-- Right column: map + feature table -->
				<div class="col-md-7 col-lg-8">
					<div class="card p-3 mb-3 h-100">
                        <div id="map-container"></div>
					</div>
				</div>
			</div>
		</div>

		<!-- JS: Bootstrap + Leaflet + Custom -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
		<script src="{{ url_for('static', filename='js/app.js') }}"></script>
	</body>
</html>
